# Рубрика оценки анкеты кандидата в волонтёры ГИМ.
#
# Источник весов и якорей «+» / «−» — таблица представителя «ГИМ вопросы анкеты веса.xlsx» (октябрь 2026).
# Каждый пункт оценивается от 0 до 3. Балл фактора и индекс — взвешенное среднее пунктов, переведённое в 0–100:
#   F_k = Σ w_i·s_i / Σ w_i × 100/3   (по пунктам фактора, на которые есть ответ)
#   I   = Σ w_i·s_i / Σ w_i × 100/3   (по всем пунктам с ответом)
# Вес фактора в индексе, таким образом, равен сумме весов его вопросов.
# Пункт без вопроса в анкете (в формах 2024–2025 гг. не было «Почему ГИМ» и «Сколько часов») пропускается
# и уменьшает coverage; пустой ответ на заданный вопрос оценивается как 0.

version: 1
source: "ГИМ вопросы анкеты веса.xlsx"
scale_max: 3

# Индекс 0–100 → общая оценка 0–3. Пороги условные: откалибровать по распределению оценок кураторов
# (scripts/score_anketa.py печатает предложение после прогона с LLM).
grade_thresholds: [40, 55, 70]

# Пункты, предложенные командой (их нет в таблице представителя). false — не учитывать в индексе.
use_proposed: true

# Что модель должна знать о программе. Всё, чего здесь нет, LLM не должна предполагать
# (например, конкретные группы посетителей инклюзивных программ). Описание уточнить у представителя.
program_description: |
  Волонтёрская программа Государственного исторического музея (Москва, Красная площадь), до 100 участников.
  Направления:
  - Организационное — помощь в организации культурно-массовых мероприятий музея.
  - Проектное — разработка квестов и мастер-классов для мероприятий.
  - Фондовое — помощь в работе с музейными фондами; мест мало, работа по будням днём.
  - Инклюзивное — участие в инклюзивных инициативах музея.
  - Медиа — медиапроекты музея: тексты, фото, видео, соцсети.

# Проверка уточняющих вопросов, которые GigaChat формулирует прямо в анкете (bot/inline_questions.py).
# Вопрос отклоняется, если касается чувствительной темы или упоминает группу посетителей / формат работы,
# которых нет ни в program_description, ни в ответах самого кандидата (так ловится «вопрос про аутистов»).
followup_guard:
  sensitive: "здоров|болезн|диагноз|лекарств|религи|вероисповед|политик|партии|национальн|семейн|замуж|женат|беремен|зарплат|доход|кредит|долг|судим|ориентац"
  terms_must_be_known: "аутис|слеп|незряч|глух|слабослыш|инвалид|овз|особ\\w* потребност|пенсионер|пожил|дошкольн|мигрант|сирот|ветеран|беженц|экскурс|лекци|квест|мастер-класс|выставк|фонд|архив|реставрац|раскоп|экспедиц|соцсет|smm|фото|видео|дизайн|перевод|лагер|театр|концерт|реконструкц"
  max_words: 25

# Анализ открытой страницы ВКонтакте (bot/vk_profile.py).
vk_analysis:
  # Короткие имена музейных и исторических сообществ (из адреса vk.com/<имя>). Сообщества, которые скрывают
  # участников, проверить нельзя — они пропускаются. Список стоит дополнить с представителем музея.
  museum_groups: [pushkinmuseum, hermitage_museum]
  # Сообщество действующих волонтёров ГИМ (короткое имя или id) — для подсчёта общих друзей.
  # Нужен сервисный ключ приложения ВК (VK_SERVICE_TOKEN), иначе пункт пропускается.
  volunteers_group: null
  # Подписки с такими словами в названии считаются музейными и историческими (тоже нужен VK_SERVICE_TOKEN).
  subscription_keywords: "музе|истори|археолог|краевед|реконструк|архив|наследи|галере|усадьб|кремл"

factors:
  engagement: Вовлечённость
  availability: Доступность
  experience: Опыт и навыки
  direction_fit: Соответствие направлению
  quality: Качество анкеты

# Вопросы с весом 0 по решению представителя: собираем для справки, в индекс не входят.
info_only: [vuz, sci_interests, languages]

items:
  # ---------------------------------------------------------------- Вовлечённость
  - id: why_gim
    question: "Почему Вы выбрали волонтерскую программу Исторического музея?"
    factor: engagement
    weight: 4
    method: llm
    anchors:
      3: "Названа личная связь с ГИМ и что-то конкретное: регулярно посещает музей, выставки, экскурсии; образование или работа связаны с историей и это связано с музеем."
      2: "Одна конкретная причина: посещает музей ИЛИ образование связано с историей."
      1: "Общие фразы без конкретики: «люблю историю», «интересно», «хочу в музей»."
      0: "Нет ответа, отписка или «пробовался в другие музеи, но меня не взяли»."

  - id: expectations
    question: "Чего Вы ожидаете от волонтерства в Историческом музее?"
    factor: engagement
    weight: 4
    method: llm
    anchors:
      3: "Конкретная цель, связанная с музейным делом, или названа ценность именно ГИМ. Длина не важна: короткий ответ с ясной целью — это 3."
      2: "Цель названа, но она про собственное развитие без связи с музейным делом: пройти практику для учёбы, получить опыт работы с людьми, развить профессиональные навыки, реализовать знания из университета."
      1: "Общие слова без цели: «новый опыт», «новые знакомства», «интересное», «много всего»."
      0: "Нет ответа, «пока не определился», «не знаю»."
    examples_2:
      - "Хочу развить профессиональные навыки и получить опыт работы в команде."
    examples_3:
      - "Мне интересно музейное дело и работа в музейных учреждениях."
      - "Данная волонтерская программа была выбрана потому, что она дает возможность поработать в одном из старейших музеев РФ."
      - "Для меня Исторический музей стал одним из самых любимых музеев, регулярно посещаю выставки и экскурсии, хотелось бы попробовать стать его частью"

  - id: source
    question: "Откуда Вы узнали о Волонтерской программе?"
    factor: engagement
    weight: 3
    method: rule
    # Представитель: рекомендация друзей даёт 1 или 2 балла, остальные варианты — 0 или 1.
    # Шкала 0–3: друг — действующий волонтёр ГИМ (бот уточняет) → 3, рекомендация друзей → 2, прочие → 1, нет ответа → 0.
    points: {friend_volunteer: 3, friends: 2, other: 1, empty: 0}

  - id: vk_museum_interest
    question: "ВКонтакте: музейные и исторические сообщества (автоматически)"
    factor: engagement
    weight: 2
    method: rule
    proposed: true   # критерий кураторов «цифровой след»; в таблице весов представителя пункта нет
    # 2+ сообществ или подписок → 3, одно → 2, ни одного → 1 (отсутствие — слабый сигнал), не проверено → пропуск
    points: {many: 3, one: 2, none: 1}

  - id: vk_volunteer_network
    question: "ВКонтакте: друзья среди волонтёров ГИМ (автоматически)"
    factor: engagement
    weight: 2
    method: rule
    proposed: true   # из заметок встречи: кандидат «уже вовлечён в сеть» — плюс
    points: {many: 3, one: 2, none: 1}

  # ---------------------------------------------------------------- Доступность
  - id: status
    question: "Ваш нынешний статус: Студент/работаю/безработный"
    factor: availability
    weight: 4
    method: rule
    # «−» у представителя: «и студент, и работаю» = мало времени на волонтёрство.
    # «безработный» стоит в обеих колонках — уточнить; пока считаем одиночным статусом (3).
    points: {single: 3, study_and_work: 1, empty: 0}

  - id: course
    question: "Курс"
    factor: availability
    weight: 3
    method: rule
    # «+» 2–6 курс, «−» 1 курс бакалавриата. Выпускники и магистранты — как старшие курсы.
    points: {first_year_bach: 0, senior_or_graduate: 3, spo_or_dpo: 2, empty: 0}

  - id: hours_month
    question: "Сколько времени Вы готовы уделять добровольческой деятельности в месяц?"
    factor: availability
    weight: 3
    method: rule
    # «+» 30+ часов, «−» меньше 30. Ниже 30 даём ступени, чтобы 25 часов отличались от 5.
    steps: [[30, 3], [20, 2], [10, 1], [0, 0]]

  - id: geography
    question: "Где вы живёте"
    factor: availability
    weight: 3
    method: rule
    proposed: true   # из заметок встречи: Подмосковье — минус; в таблице весов вопроса нет
    points: {moscow: 3, region_near: 2, region_far: 1, other_city: 0, empty: 0}

  # ---------------------------------------------------------------- Опыт и навыки
  - id: experience
    question: "Опыт работы, стажировки, участие в проектах и т.д."
    factor: experience
    weight: 5
    method: llm
    # LLM находит категории с цитатами, балл считается правилом по найденным категориям.
    categories:
      volunteering: "Опыт волонтёрской деятельности"
      disability: "Опыт взаимодействия с людьми с инвалидностью"
      children: "Опыт работы с детьми (вожатый, педагог, репетитор, аниматор)"
      archaeology: "Участие в археологических раскопках, экспедициях"
      museum_practice: "Практика, работа или волонтёрство в музее (любом), архиве, на выставке"
      own_projects: "Реализация собственных проектов: кандидат сам придумал и сделал (не работа по найму и не учебное задание)"
    # Цитата LLM засчитывается в категорию, только если в ней есть одно из слов категории:
    # так отсекаются явные ошибки вроде «фестиваль» → «практика в музее».
    category_keywords:
      volunteering: "волонт|доброволь"
      disability: "инвалид|овз|инклюз|глух|слеп|незряч|особ\\w* потребност|ограниченн\\w* возможност"
      children: "дет|школьн|вожат|подрост|ребен|ребён|репетит|педагог|учител|лагер"
      archaeology: "археолог|раскоп|экспедиц"
      museum_practice: "музе|архив|выставк|экспозиц|галере|экскурс"
      own_projects: "проект|организова|организац|созда|запусти|основа|придума|разработ|реализ|стартап|квест|мастер-класс|канал|блог"
    strong: [museum_practice, archaeology]
    anchors:
      3: "Практика в музее или раскопки, либо две и более категории из списка."
      2: "Одна категория из списка."
      1: "Опыт есть, но вне списка: работа, учёба, курсы."
      0: "Опыта нет или графа пустая."

  - id: faculty
    question: "Факультет"
    factor: experience
    weight: 2
    method: rule
    # «+» история, культура, искусство, музееведение. Смежные — частично.
    points: {profile: 3, related: 1, other: 0, empty: 0}

  # ---------------------------------------------------------------- Соответствие направлению
  - id: direction_fit
    question: "В работу какого направления волонтерской деятельности ГИМ Вы бы хотели включиться?"
    factor: direction_fit
    weight: 2
    method: llm
    # «Пока не определился» и «все направления разом» → 0 правилом, без LLM.
    anchors:
      3: "Выбрано одно или несколько направлений, и в анкете есть подтверждающий опыт хотя бы для одного: фонды + археологические экспедиции; проектное + составлял исторические квесты."
      2: "Подтверждение косвенное: учёба, интересы или хобби близки к выбранному направлению."
      1: "Направления выбраны, но в анкете нет ничего, что их подтверждает."
      0: "«Пока не определился» или выбраны все предложенные направления разом."

  # ---------------------------------------------------------------- Качество анкеты
  - id: hobby
    question: "Ваши хобби"
    factor: quality
    weight: 2
    method: rule
    # «+» что угодно, «−» отсутствие хобби.
    points: {any: 3, none: 0}

  - id: vk_open_profile
    question: "ВКонтакте: открытая страница (автоматически)"
    factor: quality
    weight: 1
    method: rule
    proposed: true   # критерий кураторов: закрытый профиль — минус, открытый с реальной жизнью — плюс
    points: {open: 3, closed: 1}

  - id: form_quality
    question: "Анкета целиком"
    factor: quality
    weight: 2
    method: llm
    proposed: true   # «неграмотная и неадекватная анкета — минус» из заметок встречи
    anchors:
      3: "Грамотно и по делу, на вопросы даны ответы."
      2: "Мелкие ошибки или одна-две отписки."
      1: "Много отписок или ошибок, ответы не по вопросу, повторы слов вместо ответа («музей, музей, музей»), шуточные ответы; ФИО не совпадает с профилем ВКонтакте."
      0: "Неадекватная анкета: бессмыслица, издёвка, оскорбления вместо ответов."
