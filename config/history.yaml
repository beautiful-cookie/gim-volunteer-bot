# Таблицы музея с прошлыми наборами — по ним дашборд показывает «Наборы прошлых лет», а модель учится,
# кто из волонтёров становится активным. Как загрузить — docs/user-manual.md, раздел «Данные прошлых наборов».
#
# Файлы Excel кладите в папку data/history/ (в репозиторий она не попадает — там персональные данные).
# Каждая запись ниже — один лист таблицы:
#   file              — имя файла в data/history/
#   sheet             — название листа внутри файла
#   prefix            — короткий код для номеров анкет (O24-001, F25-014…), у каждого листа свой
#   cohort            — название набора, как его показывать в дашборде
#   interview_format  — «очно», «дистанционно» или пусто
#   interview_date    — дата собеседований (от неё считается возраст и курс)
#   start             — первый день волонтёров в программе (от него считается, сколько они в ней)
#   start_assumed     — true, если дата старта примерная
#
# Чтобы добавить новый набор: оформите лист с теми же столбцами, что «Ответы на форму (1)» весны 2025
# (ФИО, Дата рождения, ВУЗ, Факультет, Курс, Опыт работы, Интересующие направления, Чего Вы ожидаете,
# Ваше хобби, Откуда…, Сколько баллов, Взяли ли, Длительность, Еще состоит, Активность), и допишите запись.

# Дата, на которую в таблицах актуальны «Еще состоит» и «Активность». Меняйте при каждом обновлении часов.
ref_date: 2026-10-21

tables:
  - file: "Анкеты 2024 осень.xlsx"
    sheet: "Очно 30.10"
    prefix: O24
    cohort: 2024-осень
    interview_format: очно
    interview_date: 2024-10-30
    start: 2024-11-01
    start_assumed: false

  - file: "Анкеты 2024 осень.xlsx"
    sheet: "Дистант 29.10"
    prefix: D24
    cohort: 2024-осень
    interview_format: дистанционно
    interview_date: 2024-10-29
    start: 2024-11-01
    start_assumed: false

  # Дата старта весеннего набора 2025 в таблице не указана — принята условно.
  - file: "Анкеты 2025 весна.xlsx"
    sheet: "Ответы на форму (1)"
    prefix: F25
    cohort: 2025-весна
    interview_format:
    interview_date: 2025-03-01
    start: 2025-04-01
    start_assumed: true
